plugins {
    id "com.android.application"
}

/* 웹 앱 원본은 저장소 루트의 Next.js 프로젝트 하나뿐이다. `bun run build` 가 만든 정적 결과(out/)를
   빌드할 때마다 복사해 쓰고, 사본을 저장소에 두지 않는다. 고칠 곳이 두 군데가 되지 않게. */
def webOut = rootProject.file("../out")
def genDir = file("${layout.buildDirectory.get().asFile}/generated/webapp")

def syncWebApp = tasks.register("syncWebApp", Sync) {
    // Copy 가 아니라 Sync: 빌드마다 해시가 바뀌는 _next/ 의 옛 파일이 남지 않게 대상 폴더를 out/ 과 똑같이 맞춘다.
    description = "out/ 의 정적 웹 결과와 앱 아이콘을 안드로이드 소스셋으로 복사한다"
    doFirst {
        if (!new File(webOut, "index.html").exists()) {
            throw new GradleException("out/index.html 이 없습니다. 저장소 루트에서 먼저 `bun run build` 를 실행하세요.")
        }
    }
    from(webOut) { into "assets" }
    // 26 미만은 PNG 를 그대로, 26 이상은 adaptive-icon 의 배경 레이어로 쓴다.
    // 이름이 같으면 mipmap-anydpi-v26/ic_launcher.xml 이 자기를 참조하므로 분리한다.
    from(rootProject.file("icon")) { include "icon-512.png"; rename { "ic_launcher.png" };       into "res/mipmap-xxxhdpi" }
    from(rootProject.file("icon")) { include "icon-512.png"; rename { "ic_launcher_paper.png" }; into "res/mipmap-xxxhdpi" }
    into genDir
}

/* 서명 정보는 저장소 밖의 keystore.properties 에서 읽는다. 파일이 없으면
   릴리스 서명 없이도 디버그 빌드는 되도록 조용히 건너뛴다. */
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.junorion.starmap"
    // Play 는 2026-08-31 부터 신규 앱에 API 36(Android 16) 이상을 요구한다.
    compileSdk 36

    defaultConfig {
        applicationId "com.junorion.starmap"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "0.5"
    }

    signingConfigs {
        if (keystoreProps.getProperty("storeFile")) {
            release {
                storeFile file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ["${genDir}/assets"]
            res.srcDirs   += ["${genDir}/res"]
        }
    }

    androidResources {
        // 기본 무시 패턴의 `<dir>_*` 가 밑줄로 시작하는 디렉토리를 빼 버린다. Next.js 결과의 핵심인
        // _next/ (JS·CSS·글꼴) 가 통째로 빠지므로, 그 항목만 뺀 패턴으로 바꾼다.
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreProps.getProperty("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // 앱 자산을 https://appassets.androidplatform.net/ 으로 내준다. Next.js 결과가 /_next/…, /data/…
    // 같은 루트 경로로 파일을 부르고, 위치 API 는 https 같은 보안 출처에서만 동작하기 때문이다.
    implementation "androidx.webkit:webkit:1.18.0"
}

tasks.named("preBuild") { dependsOn syncWebApp }
