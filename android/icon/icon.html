<!DOCTYPE html>
<!-- Starmap 앱 아이콘 원본. app_development 템플릿의 app-icon skill(render_icon.sh)이 512px 로
     찍어 icon-512.png 를 만든다. maskable 아이콘이라 배경은 가장자리까지 채우고, 그림은
     가운데 80% 안전 영역 안에 둔다. 하늘지도와 같은 밤하늘색·별자리 선·지평선 원을 쓴다. -->
<html><head><meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 42%, #1b2547 0%, #0b1020 70%); }
</style></head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512">
  <!-- 지평선 원과 고도 원 -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#cbd5e1" stroke-opacity=".55" stroke-width="5"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="#94a3b8" stroke-opacity=".22" stroke-width="3"/>
  <!-- 오리온자리를 닮은 별자리 선 -->
  <g stroke="#93c5fd" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M196 146 L232 230 L256 246 L280 262 L316 360"/>
    <path d="M318 150 L280 262"/>
    <path d="M196 146 L318 150"/>
    <path d="M232 230 L190 352"/>
    <path d="M190 352 L316 360"/>
  </g>
  <g fill="#ffffff">
    <circle cx="196" cy="146" r="13"/>
    <circle cx="318" cy="150" r="10"/>
    <circle cx="232" cy="230" r="8"/>
    <circle cx="256" cy="246" r="8"/>
    <circle cx="280" cy="262" r="8"/>
    <circle cx="190" cy="352" r="9"/>
    <circle cx="316" cy="360" r="14"/>
  </g>
  <!-- 배경의 작은 별 -->
  <g fill="#e2e8f0" fill-opacity=".7">
    <circle cx="150" cy="210" r="3"/><circle cx="360" cy="215" r="3.5"/><circle cx="140" cy="300" r="2.5"/>
    <circle cx="372" cy="300" r="3"/><circle cx="256" cy="120" r="2.5"/><circle cx="250" cy="394" r="3"/>
    <circle cx="340" cy="110" r="2"/><circle cx="170" cy="400" r="2"/>
  </g>
  <!-- 노란 강조: 선택한 별자리처럼 가장 밝은 별 하나 -->
  <circle cx="196" cy="146" r="22" fill="none" stroke="#facc15" stroke-width="4" stroke-opacity=".9"/>
</svg>
</body></html>
